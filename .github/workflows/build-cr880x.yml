name: Build CR880x firmware + kmod feed

# Builds the Xiaomi CR880x (xiaomi_cr8806, 256 MB profile) image from the
# newest upstream submodule tip, then publishes the image and the build's own
# APK package repository (which contains every kmod-*.apk) to GitHub Pages.
#
# Schedule: cron */14 (days 1, 15 and 29 of each month, UTC). It is commented
# out for now; uncomment the two lines below to enable it. workflow_dispatch
# always works.
#
# The image's /etc/apk/repositories.d/distfeeds.list points at this build's
# own feed, so kmods only install on an image from the same build.

on:
  # Tạm thời tắt lịch; bỏ comment 2 dòng dưới để bật chạy mỗi 14 ngày.
  # schedule:
  #   - cron: '0 0 */14 * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish to GitHub Releases
        type: boolean
        default: false

concurrency:
  group: build-cr880x
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET: qualcommax/ipq50xx
  DEVICE: xiaomi_cr8806
  SUBMODULE: openwrt-nss-edma
  CI_DIR: .github/ci
  PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  TAG_RE: '^ipq50xx-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?(-a[0-9]+)?$'
  KEEP: '3' # build directories to keep on gh-pages

jobs:
  build:
    name: Build CR8806 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FEED_ONLY_PACKAGES: zram-swap kmod-zram nssinfo luci-app-sqm sqm-scripts sqm-scripts-nss tc-full
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      upstream_commit: ${{ steps.upstream.outputs.commit }}
      gitmodules: ${{ steps.upstream.outputs.gitmodules }}
    steps:
      - name: Assign build tag
        id: tag
        run: |
          tag="ipq50xx-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          # A rebuild may fetch a newer upstream commit and generate a new APK key.
          if (( GITHUB_RUN_ATTEMPT > 1 )); then tag="${tag}-a${GITHUB_RUN_ATTEMPT}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Check runner disk space
        run: |
          set -euo pipefail
          # Some runner images have no separate disk at /mnt. Keep the build
          # in the workspace and reclaim space only on smaller runners.
          df -hT "$GITHUB_WORKSPACE"
          if [[ -d /mnt ]]; then df -hT /mnt; fi
          free_bytes=$(df -PB1 "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          if (( free_bytes < 40 * 1024 * 1024 * 1024 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force >/dev/null 2>&1 || true
            df -hT "$GITHUB_WORKSPACE"
          fi

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true
          sudo apt-get install -y bzip2 g++ gawk gcc git glibc-source \
            libncurses-dev make rsync

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The OpenWrt tree is a submodule; it is fetched separately below so
          # it can be moved to the upstream branch tip instead of the pinned gitlink.

      - name: Pull submodule to the newest upstream commit
        id: upstream
        run: |
          set -euo pipefail
          git submodule update --init --remote "$SUBMODULE"
          commit=$(git -C "$SUBMODULE" rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "gitmodules=$(git rev-parse HEAD:.gitmodules)" >> "$GITHUB_OUTPUT"
          git submodule status

      - name: Apply CR880x board patches
        working-directory: openwrt-nss-edma
        run: |
          set -euo pipefail
          for p in ../patches/*.patch; do
            echo "applying $p"
            git apply "$p" || git apply --3way "$p"
          done

      - name: Feeds
        working-directory: openwrt-nss-edma
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: openwrt-nss-edma
        run: |
          set -euo pipefail
          cp "../${CI_DIR}/cr8806.config" .config
          make defconfig
          # Fail loudly instead of silently producing an image without the NSS plane.
          for sym in \
            CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_xiaomi_cr8806=y \
            CONFIG_PACKAGE_nss-tools-dwmac=y \
            CONFIG_PACKAGE_MAC80211_NSS_SUPPORT=y \
            CONFIG_ATH11K_NSS_SUPPORT=y \
            CONFIG_NSS_MEM_PROFILE_LOW=y \
            CONFIG_CCACHE=y \
            CONFIG_PACKAGE_kmod-qca-nss-ecm=y \
            CONFIG_PACKAGE_kmod-qca-dwmac-nss=y; do
            grep -qxF "$sym" .config || { echo "::error::defconfig dropped $sym"; exit 1; }
          done
          # Keep optional packages downloadable without putting them in the image.
          read -ra optional <<< "$FEED_ONLY_PACKAGES"
          for pkg in "${optional[@]}"; do
            grep -qxF "CONFIG_PACKAGE_${pkg}=m" .config \
              || { echo "::error::$pkg must be built for the feed only"; exit 1; }
          done
          # Point the image at this build's own feed. The official snapshot feeds
          # stay for non-kernel packages; their kmods have a different vermagic.
          mkdir -p files/etc/apk/repositories.d
          {
            echo "${PAGES_BASE}/${TAG}/packages.adb"
            for f in base luci packages routing telephony video; do
              echo "https://downloads.openwrt.org/snapshots/packages/aarch64_cortex-a53/${f}/packages.adb"
            done
          } >files/etc/apk/repositories.d/distfeeds.list
          cat files/etc/apk/repositories.d/distfeeds.list
          ./scripts/diffconfig.sh >"../diffconfig-${TAG}.txt"

      - name: Compute cache keys
        id: cache
        working-directory: openwrt-nss-edma
        run: |
          set -euo pipefail
          # Resolve upstream and feed revisions, not the superproject gitlink.
          inputs=$({
            git rev-parse HEAD
            ./scripts/feeds list -fs
            cat "../diffconfig-${TAG}.txt"
            sha256sum ../patches/*.patch
          } | sha256sum | cut -c1-24)
          toolchain=$({
            git rev-parse HEAD:toolchain HEAD:tools/ccache
            grep -E '^CONFIG_(ARCH|BINUTILS|GCC|LIBC|MUSL|TARGET_OPTIMIZATION)' .config
            gcc --version
            as --version
            getconf GNU_LIBC_VERSION
          } | sha256sum | cut -c1-24)
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          echo "ccache-prefix=cr8806-ccache-v1-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-unknown}-${toolchain}-" >> "$GITHUB_OUTPUT"

      - name: Restore source archives
        id: sources
        uses: actions/cache/restore@v6
        with:
          path: openwrt-nss-edma/dl
          key: cr8806-dl-v1-inventory
          restore-keys: cr8806-dl-v1-

      - name: Download sources
        working-directory: openwrt-nss-edma
        timeout-minutes: 75
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
          CURL_OPTIONS: --speed-limit 1000 --speed-time 60
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if timeout --kill-after=60 20m make download -j"$(nproc)"; then
              ok=1
              break
            fi
            echo "::warning::download attempt $attempt failed"
            find dl -maxdepth 1 -name '*.dl' -printf '::warning::unfinished: %f (%s bytes)\n' || true
          done
          [[ "$ok" == 1 ]] || { echo "::error::sources could not be downloaded"; exit 1; }

      - name: Inventory downloaded archives
        id: archives
        working-directory: openwrt-nss-edma
        run: |
          set -euo pipefail
          find dl -maxdepth 1 -type f \( -name '*.dl' -o -name '*.hash' \) -delete
          inventory=$(find dl -maxdepth 1 -type f -printf '%f %s\n' | LC_ALL=C sort | sha256sum | cut -c1-24)
          echo "key=cr8806-dl-v1-${inventory}" >> "$GITHUB_OUTPUT"
          du -sh dl

      # Save before compiling, but do not write another copy of an unchanged inventory.
      - name: Save source archives
        if: steps.archives.outputs.key != steps.sources.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: openwrt-nss-edma/dl
          key: ${{ steps.archives.outputs.key }}

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: openwrt-nss-edma/.ccache
          key: ${{ steps.cache.outputs.ccache-prefix }}${{ steps.cache.outputs.inputs }}
          restore-keys: ${{ steps.cache.outputs.ccache-prefix }}

      - name: Build
        working-directory: openwrt-nss-edma
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 4G
          CCACHE_STATSLOG: ${{ runner.temp }}/cr8806-ccache.log
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)"; then
            make -j1 V=s 2>&1 | tail -300
            exit 1
          fi

      - name: Report build cache and disk usage
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        working-directory: openwrt-nss-edma
        env:
          CCACHE_STATSLOG: ${{ runner.temp }}/cr8806-ccache.log
        run: |
          df -hT .
          if [[ -x staging_dir/host/bin/ccache && -f "$CCACHE_STATSLOG" ]]; then
            CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache --show-log-stats || true
          fi

      - name: Save compiler cache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: openwrt-nss-edma/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Index the package repository
        working-directory: openwrt-nss-edma
        run: |
          set -euo pipefail
          make package/index
          # Public half of the build-local key that signed packages.adb.
          [[ -f public-key.pem ]] && cp public-key.pem "bin/targets/${TARGET}/packages/public-key.pem" || true

      - name: Check the output
        working-directory: openwrt-nss-edma
        run: |
          set -euo pipefail
          out="bin/targets/${TARGET}"
          for f in \
            "openwrt-qualcommax-ipq50xx-${DEVICE}-initramfs-uImage.itb" \
            "openwrt-qualcommax-ipq50xx-${DEVICE}-squashfs-factory.ubi" \
            "openwrt-qualcommax-ipq50xx-${DEVICE}-squashfs-sysupgrade.bin"; do
            [[ -f "$out/$f" ]] || { echo "::error::missing $out/$f"; exit 1; }
          done
          [[ -s "$out/packages/packages.adb" ]] || { echo "::error::no package index"; exit 1; }
          [[ -s "$out/packages/public-key.pem" ]] || { echo "::error::no package public key"; exit 1; }
          read -ra optional <<< "$FEED_ONLY_PACKAGES"
          for pkg in "${optional[@]}"; do
            compgen -G "$out/packages/${pkg}-[0-9]*.apk" >/dev/null \
              || { echo "::error::$pkg is missing from the package repository"; exit 1; }
          done
          manifest="$out/openwrt-qualcommax-ipq50xx.manifest"
          [[ -s "$manifest" ]] || { echo "::error::no image manifest"; exit 1; }
          for pkg in "${optional[@]}" bind-dig dumpimage htop iperf3; do
            if grep -q "^${pkg}[[:space:]]" "$manifest"; then
              echo "::error::$pkg must not be built into the image"
              exit 1
            fi
          done
          compgen -G "$out/packages/kmod-*.apk" >/dev/null \
            || { echo "::error::no kmod packages built"; exit 1; }
          n=$(find "$out/packages" -maxdepth 1 -name 'kmod-*.apk' | wc -l)
          echo "firmware images: 3"
          echo "kmod packages: $n" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.tag.outputs.tag }}
          path: |
            openwrt-nss-edma/bin/targets/qualcommax/ipq50xx/*xiaomi_cr8806*
            openwrt-nss-edma/bin/targets/qualcommax/ipq50xx/sha256sums
            openwrt-nss-edma/bin/targets/qualcommax/ipq50xx/config.buildinfo
            openwrt-nss-edma/bin/targets/qualcommax/ipq50xx/feeds.buildinfo
            openwrt-nss-edma/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx.manifest
          if-no-files-found: error
          retention-days: 3

      - name: Upload package repository
        uses: actions/upload-artifact@v4
        with:
          name: kmods-${{ steps.tag.outputs.tag }}
          path: openwrt-nss-edma/bin/targets/qualcommax/ipq50xx/packages/
          if-no-files-found: error
          retention-days: 3

  update_submodule:
    name: Save the built upstream commit on the default branch
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
      BUILT_GITMODULES: ${{ needs.build.outputs.gitmodules }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}

      - name: Advance the submodule pointer
        run: |
          set -euo pipefail
          current=$(git rev-parse "HEAD:$SUBMODULE")
          if [[ "$current" == "$UPSTREAM_COMMIT" ]]; then
            echo "The submodule already points to $current."
            exit 0
          fi
          if [[ "$(git rev-parse HEAD:.gitmodules)" != "$BUILT_GITMODULES" ]]; then
            echo "::error::.gitmodules changed since this build; run a new build from the default branch."
            exit 1
          fi

          # Inspect only upstream history; do not run upstream code in this write-enabled job.
          url=$(git config -f .gitmodules --get "submodule.$SUBMODULE.url")
          branch=$(git config -f .gitmodules --get "submodule.$SUBMODULE.branch")
          history=$(mktemp -d "$RUNNER_TEMP/openwrt-gitlink.XXXXXX")
          git clone --bare --filter=blob:none --single-branch --branch "$branch" "$url" "$history"
          if ! git -C "$history" merge-base --is-ancestor "$UPSTREAM_COMMIT" "refs/heads/$branch"; then
            echo "::error::The built commit is no longer on the configured upstream branch."
            exit 1
          fi
          if git -C "$history" merge-base --is-ancestor "$UPSTREAM_COMMIT" "$current"; then
            echo "The default branch already points to a newer upstream commit."
            exit 0
          fi
          if ! git -C "$history" merge-base --is-ancestor "$current" "$UPSTREAM_COMMIT"; then
            echo "::error::The upstream commits have diverged or history is missing; the pointer was not changed."
            exit 1
          fi

          git update-index --cacheinfo "160000,$UPSTREAM_COMMIT,$SUBMODULE"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: update OpenWrt submodule to ${UPSTREAM_COMMIT:0:12}"
          # A competing push is rejected rather than overwriting the default branch.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

  publish:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out gh-pages
        run: |
          set -euo pipefail
          git init -q site
          cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null; then
            git checkout -q -b gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi

      - uses: actions/download-artifact@v4
        with:
          name: kmods-${{ needs.build.outputs.tag }}
          path: site/${{ needs.build.outputs.tag }}/

      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.build.outputs.tag }}
          path: site/${{ needs.build.outputs.tag }}/firmware/

      - name: Arrange, prune, push
        run: |
          set -euo pipefail
          cd site
          [[ -f "${TAG}/packages.adb" ]] || { echo "::error::no package index in artifact"; exit 1; }
          # Keep the newest KEEP builds, comparing run and attempt numbers numerically.
          mapfile -t dirs < <(find . -maxdepth 1 -type d -printf '%f\n' | grep -E "$TAG_RE" | sort -Vr)
          for old in "${dirs[@]:${KEEP}}"; do
            echo "prune $old"
            rm -rf "$old"
          done
          {
            echo "# Xiaomi CR880x OpenWrt (NSS offload)"
            echo
            echo "One directory per build. Firmware images and that build's signed APK"
            echo "repository are kept together: a kmod only installs on an image from the"
            echo "same build."
            echo
            echo "| build | APK feed | firmware |"
            echo "|---|---|---|"
            for t in "${dirs[@]:0:KEEP}"; do
              echo "| $t | [packages.adb](${t}/packages.adb) | [firmware/](${t}/firmware/) |"
            done
            echo
            echo "On the router: \`apk update && apk add kmod-wireguard\`."
          } >index.md
          touch .nojekyll
          # One squashed commit per build: the branch holds binaries, not history.
          git checkout -q --orphan gh-pages-new
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -qm "build ${TAG}"
          git push -q --force origin gh-pages-new:gh-pages
          echo "published ${PAGES_BASE}/${TAG}/" | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish to GitHub Releases
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.build.outputs.tag }}
          path: firmware/

      - uses: actions/download-artifact@v4
        with:
          name: kmods-${{ needs.build.outputs.tag }}
          path: apk-feed/

      - name: Publish firmware and matching APK feed
        run: |
          set -euo pipefail
          archive="${TAG}-apk-feed.tar.gz"
          # The upstream checksum list also names target files not shipped in the release.
          (
            cd firmware
            sha256sum -- *.itb *.ubi *.bin > sha256sums
          )
          test -s apk-feed/packages.adb
          test -s apk-feed/public-key.pem
          # APK payloads are already compressed; keep the original signed index and packages.
          tar -czf "$archive" -C apk-feed .
          sha256sum "$archive" > "${archive}.sha256"
          {
            printf 'OpenWrt snapshot for Xiaomi CR880x (`%s`).\n\n' "$DEVICE"
            printf -- '- OpenWrt upstream: https://github.com/kuncy7/openwrt-nss-edma/commit/%s\n' "$UPSTREAM_COMMIT"
            printf -- '- Workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- GitHub Pages APK index (while retained): %s/%s/packages.adb\n\n' "$PAGES_BASE" "$TAG"
            printf 'The attached APK archive preserves this build’s signed feed, public key and kernel modules even after Pages prunes the build. Use only with matching firmware.\n'
          } > release-notes.md
          # gh uploads all assets before publishing; it does not replace an existing release.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CR880x OpenWrt ${TAG}" --prerelease --notes-file release-notes.md \
            firmware/* "$archive" "${archive}.sha256" | tee -a "$GITHUB_STEP_SUMMARY"
